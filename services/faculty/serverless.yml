service: faculty-service

useDotenv: true

provider:
  name:       aws
  runtime:    nodejs20.x
  region:     ap-south-1
  timeout:    29
  memorySize: 256
  stage:      ${opt:stage, 'dev'}
  environment:
    SUPABASE_URL:                ${ssm:/learning-app/SUPABASE_URL}
    SUPABASE_ANON_KEY:           ${ssm:/learning-app/SUPABASE_ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY:   ${ssm:/learning-app/SUPABASE_SERVICE_ROLE_KEY}
    UPSTASH_REDIS_URL:           ${ssm:/learning-app/UPSTASH_REDIS_URL}
    UPSTASH_REDIS_TOKEN:         ${ssm:/learning-app/UPSTASH_REDIS_TOKEN}
    TPSTREAMS_API_KEY:           ${ssm:/learning-app/TPSTREAMS_API_KEY}
    TPSTREAMS_ORG_ID:            ${ssm:/learning-app/TPSTREAMS_ORG_ID}
    CHAT_NOTIFICATION_QUEUE_URL: ${ssm:/learning-app/CHAT_NOTIFICATION_QUEUE_URL}
    FIREBASE_PROJECT_ID:         ${ssm:/learning-app/FIREBASE_PROJECT_ID}
    FIREBASE_PRIVATE_KEY:        ${ssm:/learning-app/FIREBASE_PRIVATE_KEY}
    FIREBASE_CLIENT_EMAIL:       ${ssm:/learning-app/FIREBASE_CLIENT_EMAIL}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource: !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:video-upload-queue"

build:
  esbuild:
    bundle:    true
    minify:    false
    sourcemap: true
    external:
      - '@supabase/supabase-js'
      - '@upstash/redis'
      - 'dotenv'
      - '@aws-sdk/client-sqs'
      - 'zod'
      - 'firebase-admin'

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort:   3000
    lambdaPort: 3001

functions:

  # ── Course ──────────────────────────────────────────────────
  createCourse:
    handler: src/functions/course/createCourse.handler
    events:
      - http:
          path:   faculty/courses
          method: post
          cors:   true

  uploadCourseIntroVideo:
    handler: src/functions/course/uploadCourseIntroVideo.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/intro-video
          method: post
          cors:   true

  getMyCourses:
    handler: src/functions/course/getMycourse.handler
    events:
      - http:
          path:   faculty/courses
          method: get
          cors:   true

  getCourseById:
    handler: src/functions/course/getCourseById.handler
    events:
      - http:
          path:   faculty/courses/{courseId}
          method: get
          cors:   true

  getCoursePreview:
    handler: src/functions/course/getCoursePreview.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/preview
          method: get
          cors:   true

  updateCourse:
    handler: src/functions/course/updateCourse.handler
    events:
      - http:
          path:   faculty/courses/{courseId}
          method: patch
          cors:   true

  publishCourse:
    handler: src/functions/course/publishCourse.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/publish
          method: patch
          cors:   true

  deleteCourse:
    handler: src/functions/course/deleteCourse.handler
    events:
      - http:
          path:   faculty/courses/{courseId}
          method: delete
          cors:   true

  getCourseContent:
    handler: src/functions/course/getCourseContent.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/content
          method: get
          cors:   true

  getAllProcessingMaterial:
    handler: src/functions/course/getProcessingMaterial.handler
    events:
      - http:
          path:   faculty/courses/processing-materials
          method: get
          cors:   true

  getAllCourseReviews:
    handler: src/functions/course/getAllReviews.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/reviews
          method: get
          cors:   true

  addReviewReply:
    handler: src/functions/course/reviewReply.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/reviews/{reviewId}/reply
          method: post
          cors:   true

  addCoursePricing:
    handler: src/functions/course/addCoursePricing.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/pricing
          method: patch
          cors:   true

  getAllContentInModule:
    handler: src/functions/course/getAllContentInModule.handler
    events:
      - http:
          path:   faculty/courses/modules/{moduleId}/contents
          method: get
          cors:   true

  getCourseAnalytics:
    handler: src/functions/course/getCourseAnalytics.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/analytics
          method: get
          cors:   true

  getCourseEnrollmentVsCompletionChart:
    handler: src/functions/course/getCourseEnrollmentVsCompletionChart.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/enrollment-vs-completion-chart
          method: get
          cors:   true

  getCourseRevenueTrend:
    handler: src/functions/course/getCourseRevenueTrend.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/revenue-trend
          method: get
          cors:   true

  # ── Folder ──────────────────────────────────────────────────
  createFolderInCourse:
    handler: src/functions/folder/createFolder.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/folders
          method: post
          cors:   true

  updateFolder:
    handler: src/functions/folder/updateFolder.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/folders/{folderId}
          method: patch
          cors:   true

  deleteFolder:
    handler: src/functions/folder/deleteFolder.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/folders/{folderId}
          method: delete
          cors:   true

  getFullFoldersInCourse:
    handler: src/functions/course/getFullFoldersIncourse.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/folders
          method: get
          cors:   true

  # ── Material ─────────────────────────────────────────────────
  createMaterial:
    handler: src/functions/material/createMaterial.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/materials
          method: post
          cors:   true

  updateMaterial:
    handler: src/functions/material/updateMaterial.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/materials/{materialId}
          method: patch
          cors:   true

  deleteMaterial:
    handler: src/functions/material/deleteMaterial.handler
    events:
      - http:
          path:   faculty/courses/{courseId}/materials/{materialId}
          method: delete
          cors:   true

  # ── Bundle ───────────────────────────────────────────────────
  createCourseBundle:
    handler: src/functions/bundle/createBundle.handler
    events:
      - http:
          path:   faculty/bundle
          method: post
          cors:   true

  getMyBundles:
    handler: src/functions/bundle/getMyBundles.handler
    events:
      - http:
          path:   faculty/bundle
          method: get
          cors:   true

  getBundleById:
    handler: src/functions/bundle/getBundelById.handler
    events:
      - http:
          path:   faculty/bundle/{bundleId}
          method: get
          cors:   true

  updateBundle:
    handler: src/functions/bundle/updateBundle.handler
    events:
      - http:
          path:   faculty/bundle/{bundleId}
          method: patch
          cors:   true

  deleteBundle:
    handler: src/functions/bundle/deleteBundle.handler
    events:
      - http:
          path:   faculty/bundle/{bundleId}
          method: delete
          cors:   true

  # ── Students ─────────────────────────────────────────────────
  getAllStudents:
    handler: src/functions/students/getAllStudents.handler
    events:
      - http:
          path:   faculty/students
          method: get
          cors:   true

  getStudentCourses:
    handler: src/functions/students/getStudentCourses.handler
    events:
      - http:
          path:   faculty/students/{studentId}/courses
          method: get
          cors:   true

  getStudentAnalytics:
    handler: src/functions/students/getStudentAnalytics.handler
    events:
      - http:
          path:   faculty/students/{studentId}/analytics
          method: get
          cors:   true

  # ── Announcements ────────────────────────────────────────────
  createAnnouncement:
    handler: src/functions/announcements/createAnnouncement.handler
    events:
      - http:
          path:   faculty/announcements
          method: post
          cors:   true

  getAllAnnouncements:
    handler: src/functions/announcements/getAllAnnouncement.handler
    events:
      - http:
          path:   faculty/announcements
          method: get
          cors:   true

  getAnnouncementById:
    handler: src/functions/announcements/getAnnouncementById.handler
    events:
      - http:
          path:   faculty/announcements/{announcementId}
          method: get
          cors:   true

  updateAnnouncement:
    handler: src/functions/announcements/updateAnnouncement.handler
    events:
      - http:
          path:   faculty/announcements/{announcementId}
          method: patch
          cors:   true

  deleteAnnouncement:
    handler: src/functions/announcements/deleteAnnouncement.handler
    events:
      - http:
          path:   faculty/announcements/{announcementId}
          method: delete
          cors:   true
  


  # ── Dashboard ────────────────────────────────────────────────
  getCounterData:
    handler: src/functions/dashboard/getCounterData.handler
    events:
      - http:
          path:   faculty/dashboard/counters
          method: get
          cors:   true

  getEnrollmentTrend:
    handler: src/functions/dashboard/getEnrollmentTrend.handler
    events:
      - http:
          path:   faculty/dashboard/enrollment-trends
          method: get
          cors:   true

  getRevenueTrend:
    handler: src/functions/dashboard/getRevenueTrend.handler
    events:
      - http:
          path:   faculty/dashboard/revenue-trends
          method: get
          cors:   true

  getTopCoursesPerformance:
    handler: src/functions/dashboard/getTopCoursesPerformance.handler
    events:
      - http:
          path:   faculty/dashboard/top-courses-performances
          method: get
          cors:   true

  # ── Test ─────────────────────────────────────────────────────
  createTest:
    handler: src/functions/test/createTest.handler
    events:
      - http:
          path:   faculty/test
          method: post
          cors:   true

  getMyAllTests:
